[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "index-browser"
dynamic = ["version"]
description = "Turn a directory of files into an interactive 3D index.html — folders unfold, files open in a new tab."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "matplo" }]
keywords = ["index", "static-site", "github-pages", "file-browser", "three.js", "directory-listing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/matplo/index-browser"
Issues = "https://github.com/matplo/index-browser/issues"

[project.scripts]
index-browser = "index_browser.cli:main"

[tool.hatch.version]
path = "src/index_browser/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
