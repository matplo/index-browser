<style>
  :root {
    --bg: #05070d;
    --ink: #e8ecf4;
    --muted: #97a3b8;
    --faint: #5f6a82;
    --line: rgba(148, 163, 184, .13);
    --line2: rgba(148, 163, 184, .24);
    --glass: rgba(9, 13, 25, .68);

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

    max-width: 260px; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 3px var(--bg, #05070d), 0 0 6px var(--bg, #05070d);
  }
  .lbl.file .lbl-in { font: 400 11px/1.25 var(--mono); color: #aab4c8; }
  .lbl.focus .lbl-in { font-weight: 600; font-size: 13.5px; color: #fff; }
  .lbl.hot .lbl-in { color: #fff; }
  .lbl-ct { font: 500 11px var(--mono); color: var(--c); }

  .mark {

    color: var(--ink); text-align: left; text-decoration: none; cursor: pointer;

  .d-path { margin-top: 6px; color: var(--faint); font: 11px/1.45 var(--mono); overflow-wrap: anywhere; }

    display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; margin-top: 12px;
    border-radius: 10px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);

  .d-open:hover { background: color-mix(in srgb, var(--c) 28%, transparent); }

    position: fixed; z-index: 4; bottom: 22px; left: calc((100vw + var(--panel-w) + 32px) / 2); transform: translateX(-50%);

    .toolbar { top: 8px; right: 8px; }
    .detail { top: 60px; bottom: auto; left: 8px; right: 8px; width: auto; }

    const kids = el('div', 'kids'), inner = el('div', 'kids-in');

    row.insertAdjacentHTML('beforeend', `<span class="go">${ICON.go}</span>`);

}
root.children.forEach((c, i) => treeEl.appendChild(buildRow(c, i)));
const emptyEl = el('div', 'empty', root.children.length ? 'No matching files.' : 'Nothing here yet.');
emptyEl.hidden = root.children.length > 0;
treeEl.appendChild(emptyEl);

function syncRow(n) {
  if (n.type !== 'dir' || !n.row) return;

}

/* ---- expand / collapse (shared by list and scene) ---- */
// One open folder per level: opening a folder folds its open siblings; folding one folds
// everything inside it. Keeps the 3D fans from cutting through each other.
function fold(d) {
  d.expanded = false; syncRow(d);
  for (const c of d.children) if (c.type === 'dir' && c.expanded) fold(c);
}
function setExpanded(n, v) {
  if (n.type !== 'dir' || n === root || n.expanded === v) return;
  if (v) {
    for (const s of n.parent.children) if (s !== n && s.type === 'dir' && s.expanded) fold(s);
    n.expanded = true; syncRow(n);
  } else fold(n);
  setHash(v ? n : n.parent);
  view?.relayout(v ? n : n.parent);
  if (shown === n) { shown = null; showDetail(n); }
}
function toggle(n) {
  if (n === root) return collapseAll();
  setExpanded(n, !n.expanded);
  dismissHint();
}
function expandAll() { dirs.forEach(d => { d.expanded = true; syncRow(d); }); setHash(root); view?.relayout(root); }
function collapseAll() { dirs.forEach(d => { d.expanded = d === root; syncRow(d); }); setHash(root); view?.relayout(root); }
function reveal(n) { for (let p = n.parent; p && p !== root; p = p.parent) { p.expanded = true; syncRow(p); } }

function setHash(n) {
  const url = n && n !== root ? '#' + encodeURI(n.path) : location.pathname + location.search;
  history.replaceState(null, '', url);
}

/* ---- hover + detail card ---- */

}

const detail = $('#detail');
function showDetail(n) {

  shown = n;
  detail.style.setProperty('--c', n.color);
  detail.replaceChildren();
  if (n.type === 'file' && n.kind === 'image') {
    const img = el('img', 'd-thumb'); img.src = n.href; img.alt = ''; img.decoding = 'async';
    detail.append(img);
  }
  const top = el('div', 'd-top');
  const pill = el('span', 'pill', n.type === 'dir' ? 'dir' : (n.ext || 'file').slice(0, 4));
  pill.style.setProperty('--c', n.color);
  const close = el('button', 'd-x'); close.type = 'button'; close.setAttribute('aria-label', 'Close'); close.innerHTML = ICON.x;
  close.addEventListener('click', hideDetail);
  top.append(pill, el('span', 'd-kind', n.type === 'dir' ? (n === root ? 'Collection' : 'Folder') : KIND[n.kind].label), close);
  detail.append(top, el('div', 'd-name', n.name));
  if (n.title && n.title !== n.name) detail.append(el('div', 'd-sub', n.title));
  if (n.path) detail.append(el('div', 'd-path', n.path + (n.type === 'dir' ? '/' : '')));
  const meta = el('div', 'd-meta');
  if (n.type === 'dir') meta.append(el('span', '', plural(n.fileCount, 'file')));
  meta.append(el('span', '', fmtSize(n.size)), el('span', '', fmtDate(n.mtime)));

  } else {

    b.type = 'button'; b.style.width = '100%';

function hideDetail() { detail.classList.add('off'); shown = null; }

/* ---- search + type filters ---- */
const qEl = $('#q');
const counts = {};
nodes.forEach(n => { if (n.type === 'file') counts[n.kind] = (counts[n.kind] || 0) + 1; });
const present = Object.keys(KIND).filter(k => counts[k]);
const filter = { q: '', kinds: new Set(present) };
let snapshot = null;   // expansion state from before a filter was applied

const chipsEl = $('#chips');
chipsEl.hidden = present.length < 2;
const chips = present.map(k => {
  const b = el('button', 'chip'); b.type = 'button';
  b.style.setProperty('--c', KIND[k].color);
  b.append(KIND[k].label, el('span', 'n', counts[k]));
  b.addEventListener('click', () => {
    const all = filter.kinds.size === present.length;
    if (all) filter.kinds = new Set([k]);                       // first click: show only this type
    else if (filter.kinds.has(k)) filter.kinds.delete(k);

    if (!filter.kinds.size) filter.kinds = new Set(present);     // nothing left: back to all

});

const filtering = () => !!filter.q || filter.kinds.size < present.length;

  const on = filtering();

  (function mark(n) {
    if (n.type === 'file') {
      n.match = filter.kinds.has(n.kind) && (!q || `${n.path} ${n.title || ''}`.toLowerCase().includes(q));
      return n.match;
    }
    let any = false;
    for (const c of n.children) if (mark(c)) any = true;
    return (n.match = any);
  })(root);

  if (on && !snapshot) snapshot = new Map(dirs.map(d => [d, d.expanded]));
  if (on) dirs.forEach(d => { d.expanded = d === root || d.match; });
  else if (snapshot) { snapshot.forEach((v, d) => { d.expanded = v; }); snapshot = null; }
  dirs.forEach(syncRow);
  nodes.forEach(n => { if (n.el) n.el.hidden = on && !n.match; });

}
applyFilter();
qEl.addEventListener('input', () => { filter.q = qEl.value.trim().toLowerCase(); applyFilter(); });

  if (e.key === 'Enter') {               // open the only match

});
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;

/* ---- toolbar, mobile sheet, hint ---- */
const panel = $('#panel');
if (narrow()) panel.classList.add('collapsed');
$('#pHead').addEventListener('click', () => { if (narrow()) panel.classList.toggle('collapsed'); });
$('#bExpand').addEventListener('click', expandAll);
$('#bCollapse').addEventListener('click', collapseAll);

const hint = $('#hint');

setTimeout(dismissHint, 14000);

/* ---- deep link: #path/to/folder or #path/to/file ---- */
let startFocus = root;   // folder the 3D view opens on
(function fromHash() {
  const p = decodeURI(location.hash.slice(1));
  const n = p && byPath.get(p);
  if (!n) return;
  reveal(n);
  if (n.type === 'dir') { n.expanded = true; syncRow(n); startFocus = n; }
  else { showDetail(n); startFocus = n.parent; }
  requestAnimationFrame(() => n.row?.scrollIntoView({ block: 'center' }));
})();

/* =====================================================================
   3D view
   Folders are wireframe cubes and files are camera-facing square outlines; each shape is
   one instanced draw call, so the cost hardly grows with the number of files.
   The top-level folders sit on a common surface around the root. An open folder fans its
   contents out in a plane perpendicular to its parent's plane, pointing away from the
   parent: files on the inner arcs, sub-folders on the rim (so their own fans open outward,
   past everything else). Clicking a folder opens it and flies the camera to face its fan.
   ===================================================================== */
async function initView() {
  const [THREE, { OrbitControls }] = await Promise.all([
    import('three'),
    import('three/addons/controls/OrbitControls.js'),
  ]);
  const V = THREE.Vector3;

  const BG = 0x05070d;
  const DUR = reduceMotion ? 0 : 800;
  const FILE = 1;            // file square edge
  const SP = 1.6;            // spacing between file squares along an arc
  const SPD = 3.2;           // spacing between folder cubes along an arc
  const ROW = 1.7;           // distance between the arcs of a fan
  const A = 1.2;             // half-angle of a fan (~69°)
  const TAU = Math.PI * 2;
  const LABEL_FILES = 60;    // label the focused folder's files when it has at most this many

  /* ---- renderer, camera, controls ---- */
  const canvas = $('#scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 30, 120);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 8000);
  camera.position.set(0, 30, 30);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.minDistance = 1.5;
  controls.maxDistance = 6000;

  /* ---- per-node state ---- */
  for (const d of dirs) {
    d.files = d.children.filter(c => c.type === 'file');
    d.subdirs = d.children.filter(c => c.type === 'dir');
  }
  const sizeOf = n => n.type === 'file' ? FILE : n === root ? 1.7 : Math.min(1.4, 0.85 + 0.06 * Math.log2(1 + n.fileCount));
  for (const n of nodes) Object.assign(n, {
    x: 0, y: 0, z: 0, s: 0, hs: 1, al: 1, alT: 1,
    shown: false, hiding: false, tw: null, col: new THREE.Color(n.color), sz: sizeOf(n),
  });

  /* ---- layout ----
     Each open folder lays its children on arcs in the plane spanned by (d, e): d points
     away from its parent, e is the normal of the parent's plane. The root uses the full
     circle in the horizontal plane; everything else a fan of ±A around d. A child folder
     gets d = its direction from the folder and e = this folder's plane normal, so every
     level opens perpendicular to the one before. */
  function arcs(items, sp, r, full, P, d, e, out) {
    let i = 0;
    while (i < items.length) {
      const cap = full ? Math.max(1, Math.floor(TAU * r / sp)) : Math.floor(2 * A * r / sp) + 1;
      const k = Math.min(cap, items.length - i);
      const step = full ? TAU / k : sp / r;
      for (let j = 0; j < k; j++) {
        const a = full ? Math.PI / 2 + j * step : ((k - 1) / 2 - j) * step;   // fans fill from the top
        const ca = Math.cos(a), sa = Math.sin(a);
        out.push([items[i + j], P.x + r * (ca * d.x + sa * e.x), P.y + r * (ca * d.y + sa * e.y), P.z + r * (ca * d.z + sa * e.z)]);
      }
      i += k;
      r += ROW;
    }
    return r;
  }

  function place(n, P, d, e, targets) {
    targets.set(n, [P.x, P.y, P.z]);
    if (n.type !== 'dir' || !n.expanded) return;
    const full = n === root;
    const N = new V().crossVectors(d, e).normalize();          // this folder's plane normal
    Object.assign(n, { _d: d, _e: e, _N: N });
    const out = [];
    let r = n.sz * 0.7 + (full ? 2.4 : 1.8);
    if (n.files.length) r = arcs(n.files, SP, r, full, P, d, e, out) + ROW * 0.6;
    arcs(n.subdirs, SPD, r, full, P, d, e, out);
    for (const [c, x, y, z] of out) {
      const Q = new V(x, y, z);
      if (c.type === 'file') targets.set(c, [x, y, z]);
      else place(c, Q, Q.clone().sub(P).normalize(), full ? new V(0, 1, 0) : N, targets);
    }
  }

  let focus = startFocus;
  let targets = new Map();
  const openPath = n => { for (let p = n.parent; p; p = p.parent) if (!p.expanded) return false; return true; };

  function relayout(f) {
    if (f) focus = f;
    if (!openPath(focus)) focus = root;
    targets = new Map();
    place(root, new V(), new V(1, 0, 0), new V(0, 0, 1), targets);

    const now = performance.now();
    let k = 0;
    for (const n of nodes) {                       // pre-order: parents before children
      const t = targets.get(n);
      if (t) {
        if (!n.shown) {                            // appearing: start inside the parent
          const p = n.parent?.shown ? n.parent : null;
          if (p) { n.x = p.x; n.y = p.y; n.z = p.z; } else [n.x, n.y, n.z] = t;
          n.s = 0; n.shown = true;
          tween(n, t, 1, now + Math.min(k++ * 4, 350));
        } else tween(n, t, 1, now);
        n.hiding = false;
      } else if (n.shown) {                        // disappearing: shrink into the nearest visible ancestor
        let p = n.parent; while (!targets.has(p)) p = p.parent;
        const pt = targets.get(p);
        if (!n.hiding || n.tw?.x1 !== pt[0] || n.tw?.y1 !== pt[1] || n.tw?.z1 !== pt[2]) { n.hiding = true; tween(n, pt, 0, now); }
      }
    }
    refreshAlpha();
    pickLabels();
    frame(focus);
  }

  function tween(n, t, s, t0) {
    n.tw = { x0: n.x, y0: n.y, z0: n.z, s0: n.s, x1: t[0], y1: t[1], z1: t[2], s1: s, t0 };
  }
  function refreshAlpha() {               // filtered-out nodes fade; so does everything outside the focus
    const on = filtering();
    const near = new Set();
    for (let a = focus; a; a = a.parent) near.add(a);
    for (const n of nodes) {
      let inside = focus === root || near.has(n);
      for (let a = n.parent; !inside && a; a = a.parent) if (a === focus) inside = true;
      n.alT = (!on || n === root || n.match ? 1 : 0.15) * (inside ? 1 : 0.32);
    }
  }

  /* ---- camera: fly to face the focused folder's fan ---- */
  const goalT = new V(), goalP = new V();
  let flying = false, manual = false;    // manual: the user has moved the camera since the last fly-to
  function fitFor(radius) {
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const sideW = narrow() ? 0 : panel.offsetWidth + 32;
    const aspect = Math.max(0.4, (innerWidth - sideW) / innerHeight);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    const half = Math.min(vfov, hfov) / 2;
    return THREE.MathUtils.clamp(radius / Math.sin(half) * (narrow() ? 1.2 : 1.08), 6, 5000);
  }
  function frame(n) {
    // bounding sphere of the folder and everything visible below it
    const box = new THREE.Box3(), p = new V();
    (function grow(m) {
      const t = targets.get(m); if (!t) return;
      box.expandByPoint(p.fromArray(t));
      if (m.type === 'dir' && m.expanded) m.children.forEach(grow);
    })(n);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    goalT.copy(sphere.center);
    const dist = fitFor(sphere.radius + 1.2);
    const cur = new V().subVectors(camera.position, controls.target).normalize();
    let dir;
    if (n === root || !n._N) {                     // look down on the common surface, keeping the azimuth
      const az = Math.atan2(cur.x, cur.z) || 0, el = 0.62;
      dir = new V(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    } else {                                       // face the fan from whichever side the camera is on, lifted
      const N = n._N.clone(); if (N.dot(cur) < 0) N.negate();   // ~30° out of the parent's plane so the
      const e = n._e.clone(); if (e.dot(cur) < 0 && n.depth > 1) e.negate();   // folder's siblings drop out of view
      dir = N.addScaledVector(e, 0.6).addScaledVector(n._d, -0.25).normalize();
    }
    goalP.copy(goalT).addScaledVector(dir, dist);
    flying = true; manual = false;
  }
  function setFocus(n) {
    focus = n;
    setHash(n);
    refreshAlpha();
    pickLabels();
    frame(n);
  }
  controls.addEventListener('start', () => { flying = false; manual = true; dismissHint(); });

  /* ---- instanced wireframes: cubes for folders, squares for files ---- */
  const fogU = { uNear: { value: 30 }, uFar: { value: 120 } };
  const FRAG = `varying vec3 vC;
    void main() { gl_FragColor = vec4(vC, 1.0);
    #include <colorspace_fragment>
    }`;
  const CUBE_VS = `attribute vec3 iPos; attribute float iSize; attribute vec3 iColor;
    uniform float uNear, uFar; varying vec3 vC;
    void main() {
      vec3 p = position * iSize;
      p = vec3(0.707 * (p.x + p.z), p.y, 0.707 * (p.z - p.x));                     // 45° about y
      p = vec3(p.x, 0.82 * p.y - 0.57 * p.z, 0.57 * p.y + 0.82 * p.z);              // ~35° tilt: reads as a cube
      vec4 mv = viewMatrix * vec4(iPos + p, 1.0);
      gl_Position = projectionMatrix * mv;
      vC = iColor * (1.0 - smoothstep(uNear, uFar, -mv.z));
    }`;
  const SQUARE_VS = `attribute vec3 iPos; attribute float iSize; attribute vec3 iColor;
    uniform float uNear, uFar; varying vec3 vC;
    void main() {
      vec4 mv = viewMatrix * vec4(iPos, 1.0);
      mv.xy += position.xy * iSize;                                                 // always faces the camera
      gl_Position = projectionMatrix * mv;
      vC = iColor * (1.0 - smoothstep(uNear, uFar, -mv.z));
    }`;
  function instancedLines(basePositions, cap, vs) {
    const g = new THREE.InstancedBufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(basePositions, 3));
    const mk = (name, size) => {
      const a = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, cap) * size), size);
      a.setUsage(THREE.DynamicDrawUsage); g.setAttribute(name, a); return a.array;
    };
    const set = { g, pos: mk('iPos', 3), size: mk('iSize', 1), col: mk('iColor', 3), n: 0 };
    g.instanceCount = 0;
    const obj = new THREE.LineSegments(g, new THREE.ShaderMaterial({
      uniforms: fogU, vertexShader: vs, fragmentShader: FRAG,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

  const cubeEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)).getAttribute('position').array;
  const cubes = instancedLines(cubeEdges, dirs.length, CUBE_VS);
  const squares = instancedLines([-.5, -.5, 0, .5, -.5, 0, .5, -.5, 0, .5, .5, 0, .5, .5, 0, -.5, .5, 0, -.5, .5, 0, -.5, -.5, 0],
    nodes.length - dirs.length, SQUARE_VS);
  function put(set, n, size, c, b) {
    const i = set.n++;
    set.pos[i * 3] = n.x; set.pos[i * 3 + 1] = n.y; set.pos[i * 3 + 2] = n.z;
    set.size[i] = size;
    set.col[i * 3] = c.r * b; set.col[i * 3 + 1] = c.g * b; set.col[i * 3 + 2] = c.b * b;

      const a = set.g.getAttribute(name);

    }
    set.n = 0;
  }

  /* ---- folder-to-folder links (one line each) ---- */
  const lPos = new Float32Array(dirs.length * 6), lCol = new Float32Array(dirs.length * 6);
  const lGeo = new THREE.BufferGeometry();
  lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3).setUsage(THREE.DynamicDrawUsage));
  lGeo.setAttribute('color', new THREE.BufferAttribute(lCol, 3).setUsage(THREE.DynamicDrawUsage));
  const links = new THREE.LineSegments(lGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  links.frustumCulled = false; scene.add(links);

  /* ---- screen projection (picking and labels) ---- */
  const proj = { x: 0, y: 0, r: 0, z: 0 };
  function project(n) {                     // -> proj in CSS px; false when behind the camera
    const me = camera.matrixWorldInverse.elements, pe = camera.projectionMatrix.elements;
    const vx = me[0] * n.x + me[4] * n.y + me[8] * n.z + me[12];
    const vy = me[1] * n.x + me[5] * n.y + me[9] * n.z + me[13];
    const vz = me[2] * n.x + me[6] * n.y + me[10] * n.z + me[14];
    if (vz > -camera.near) return false;
    const cx = pe[0] * vx + pe[4] * vy + pe[8] * vz + pe[12];
    const cy = pe[1] * vx + pe[5] * vy + pe[9] * vz + pe[13];
    const cw = pe[3] * vx + pe[7] * vy + pe[11] * vz + pe[15];
    proj.x = (cx / cw + 1) / 2 * innerWidth;
    proj.y = (1 - cy / cw) / 2 * innerHeight;
    proj.z = -vz;
    proj.r = n.sz * 0.55 * Math.max(0, n.s) * n.hs * pe[5] * innerHeight / 2 / -vz;
    return true;
  }
  function pick(px, py) {                   // front-most node under the pointer
    let best = null, bestZ = Infinity;
    for (const n of nodes) {
      if (!n.shown || n.hiding || n.s < 0.5 || !project(n)) continue;
      const r = Math.max(6, proj.r * (n.type === 'dir' ? 1.2 : 1));
      const dx = proj.x - px, dy = proj.y - py;
      if (dx * dx + dy * dy < r * r && proj.z < bestZ) { bestZ = proj.z; best = n; }
    }
    return best;
  }

  /* ---- labels: a small pool of DOM elements for the nodes that matter right now ---- */
  const layer = el('div', 'labels');
  canvas.after(layer);
  let labeled = [];
  function labelEl(n) {
    if (n.lbl) return n.lbl;
    const d = el('div', 'lbl' + (n.type === 'file' ? ' file' : ''));
    d.style.setProperty('--c', n.color);
    const inner = el('div', 'lbl-in');
    inner.append(el('span', 'lbl-nm', n.name));
    if (n.type === 'dir' && n !== root) inner.append(el('span', 'lbl-ct', n.fileCount));
    d.append(inner);
    d.hidden = true;
    n.lblW = Math.min(260, n.name.length * (n.type === 'file' ? 6.6 : 7) + 8 + (n.type === 'dir' ? 26 : 0));
    layer.append(d);
    return (n.lbl = d);
  }
  function pickLabels() {
    const s = new Set([focus]);
    const subs = (d, files) => {
      if (d.type !== 'dir' || !d.expanded) return;
      if (d.subdirs.length <= 80) d.subdirs.forEach(c => s.add(c));
      if (files && d.files.length <= LABEL_FILES) d.files.forEach(c => s.add(c));
    };
    subs(focus, false);
    for (let a = focus.parent; a; a = a.parent) s.add(a);
    if (root.subdirs.length <= 60) root.subdirs.forEach(c => s.add(c));
    subs(focus, true);                                   // files last: lowest priority
    for (const n of labeled) if (!s.has(n)) n.lbl.hidden = true;
    labeled = [...s];
    for (const n of labeled) labelEl(n).classList.toggle('focus', n === focus);
  }
  const boxes = [];
  let lastHover = null;
  function placeLabels() {
    boxes.length = 0;
    const list = hovered ? [hovered, ...labeled.filter(n => n !== hovered)] : labeled;
    if (lastHover && lastHover !== hovered && !labeled.includes(lastHover)) lastHover.lbl.hidden = true;
    lastHover = hovered;
    const near = fogU.uNear.value, far = fogU.uFar.value;
    for (const n of list) {
      const d = labelEl(n);
      d.classList.toggle('hot', n === hovered);
      let ok = n.shown && n.s > 0.35 && project(n);
      let x = 0, y = 0, op = 0;
      if (ok) {
        x = proj.x; y = proj.y + proj.r + 3;
        op = (1 - THREE.MathUtils.smoothstep(proj.z, near, far)) * Math.min(1, n.al * 1.3);
        const w = n.lblW, h = 17, l = x - w / 2;
        ok = op > 0.06 && x > -w && x < innerWidth + w && y > -h && y < innerHeight + h;
        if (ok && n !== hovered) for (const b of boxes) if (l < b[2] && l + w > b[0] && y < b[3] && y + h > b[1]) { ok = false; break; }
        if (ok) boxes.push([l, y, l + w, y + h]);
      }
      if (!ok) { if (!d.hidden) d.hidden = true; continue; }
      d.hidden = false;
      d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
      const o = Math.round(op * 20) / 20;
      if (d._o !== o) { d.style.opacity = o; d._o = o; }
    }
  }

  /* ---- per-frame node animation ---- */
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
  const easeOutBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };
  const easeIn = t => t * t * t;
  let hovered = null;

  function step(n, now, dt) {
    const tw = n.tw;
    if (tw) {
      const t = DUR ? THREE.MathUtils.clamp((now - tw.t0) / DUR, 0, 1) : 1;
      const e = easeInOut(t);
      n.x = tw.x0 + (tw.x1 - tw.x0) * e;
      n.y = tw.y0 + (tw.y1 - tw.y0) * e;
      n.z = tw.z0 + (tw.z1 - tw.z0) * e;
      n.s = tw.s0 + (tw.s1 - tw.s0) * (tw.s1 >= tw.s0 ? easeOutBack(t) : easeIn(t));
      if (t >= 1) { n.tw = null; if (n.hiding) { n.hiding = false; n.shown = false; } }
    }
    const k = 1 - Math.pow(0.8, dt * 60);
    n.hs += ((n === hovered ? 1.3 : 1) - n.hs) * k;
    n.al += (n.alT - n.al) * k * 0.6;
  }

  const c = new THREE.Color(), white = new THREE.Color(1, 1, 1);
  function draw(now, dt) {
    let e = 0;
    for (const n of nodes) {
      if (!n.shown) continue;
      step(n, now, dt);
      if (!n.shown) continue;
      const size = n.sz * Math.max(0, n.s) * n.hs;
      const lit = n === hovered || n === hot;
      c.copy(n.col); if (lit) c.lerp(white, 0.35);
      if (n.type === 'file') { put(squares, n, size, c, n.al * (lit ? 1.7 : 0.85)); continue; }
      put(cubes, n, size, c, n.al * (lit ? 1.6 : n === focus ? 1.3 : n.expanded ? 1.05 : 0.8));
      if (n !== root && n.parent.shown) {
        const p = n.parent, f = Math.min(1, Math.max(0, n.s)) * n.al * 0.45, o = e * 6;
        lPos[o] = p.x; lPos[o + 1] = p.y; lPos[o + 2] = p.z; lPos[o + 3] = n.x; lPos[o + 4] = n.y; lPos[o + 5] = n.z;
        lCol[o] = p.col.r * f; lCol[o + 1] = p.col.g * f; lCol[o + 2] = p.col.b * f;
        lCol[o + 3] = n.col.r * f; lCol[o + 4] = n.col.g * f; lCol[o + 5] = n.col.b * f;
        e++;
      }
    }
    flush(cubes); flush(squares);
    lGeo.setDrawRange(0, e * 2);
    for (const a of [lGeo.attributes.position, lGeo.attributes.color]) {
      a.clearUpdateRanges(); a.addUpdateRange(0, e * 6); a.needsUpdate = true;
    }
  }

  /* ---- pointer ---- */
  let pointerIn = false, pointerType = 'mouse', down = null, tapped = null, px = 0, py = 0, moved = true;
  canvas.addEventListener('pointermove', e => { pointerIn = true; pointerType = e.pointerType; px = e.clientX; py = e.clientY; moved = true; });
  canvas.addEventListener('pointerleave', () => { pointerIn = false; if (hovered) { hovered = null; canvas.style.cursor = ''; setHot(null); } });
  canvas.addEventListener('pointerdown', e => { pointerType = e.pointerType; down = [e.clientX, e.clientY]; });
  canvas.addEventListener('click', e => {
    if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;   // that was a drag
    const n = pick(e.clientX, e.clientY);
    if (!n) { hideDetail(); tapped = null; return; }
    dismissHint();
    if (n.type === 'dir') { openFolder(n); if (pointerType !== 'mouse') showDetail(n); return; }
    if (pointerType !== 'mouse' && tapped !== n) { tapped = n; showDetail(n); return; }  // touch: first tap previews
    window.open(n.href, '_blank', 'noopener');
  });
  // closed folder: open it and fly there · open folder elsewhere: fly there · focused folder: close it
  function openFolder(n) {
    if (n === root) { if (focus !== root) setFocus(root); else collapseAll(); return; }
    if (!n.expanded) setExpanded(n, true);
    else if (focus !== n) setFocus(n);
    else setExpanded(n, false);
  }

  /* ---- resize ---- */
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    const shift = narrow() ? 0 : (panel.offsetWidth + 16) / 2;   // centre the scene in the space right of the panel
    if (shift) camera.setViewOffset(w, h, -shift, 0, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', () => { resize(); if (!manual) frame(focus); });
  resize();

  /* ---- loop ---- */
  const clock = new THREE.Clock();
  let frameNo = 0;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();

    if (flying) {
      const k = reduceMotion ? 1 : 1 - Math.pow(1 - 0.08, dt * 60);
      controls.target.lerp(goalT, k);
      camera.position.lerp(goalP, k);
      if (controls.target.distanceTo(goalT) < 0.01 && camera.position.distanceTo(goalP) < 0.02) flying = false;
    }
    const dist = camera.position.distanceTo(controls.target);
    fogU.uNear.value = scene.fog.near = dist * 0.9;
    fogU.uFar.value = scene.fog.far = dist * 3.5 + 20;

    controls.update();
    camera.updateMatrixWorld();

    if (pointerIn && pointerType === 'mouse' && (moved || flying || (frameNo & 3) === 0)) {
      moved = false;
      const n = pick(px, py);
      if (n !== hovered) { hovered = n; canvas.style.cursor = n ? 'pointer' : ''; setHot(n); }
    }
    draw(now, dt);
    renderer.render(scene, camera);
    placeLabels();
    frameNo++;
  });

  relayout();

  return {
    relayout,
    setHover(n) { hovered = n; },
    resetView() { setFocus(root); },
  };
}

initView()
  .then(v => { view = v; })
  .catch(err => {
    console.warn('[index-browser] 3D view unavailable, showing list only:', err);
    document.body.classList.add('flat');
    panel.classList.remove('collapsed');
  });
</script>
</body>
</html>
